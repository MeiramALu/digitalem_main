{% extends 'base.html' %}
{% load static %}

{% block main %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm text-center">
        <div class="card-body p-4 p-md-5">

          <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" fill="currentColor" class="bi bi-check-circle-fill text-success mb-4" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
          </svg>

          <h1 class="card-title h3 mb-3">Выход выполнен</h1>
          <p class="card-text text-muted mb-4">
            Вы успешно вышли из своей учетной записи. Ждём вас снова!
          </p>

          <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-4 gap-3">Войти снова</a>
            <a href="{% url 'index' %}" class="btn btn-outline-secondary btn-lg px-4">На главную</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock main %}
